<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f8">
  <title>家的参考册 · 装修灵感与元素偏好</title>
  <meta name="description" content="按原文件名浏览装修参考图，逐个选择喜欢的材质、色彩、造型与灯光，整理给设计师的沟通清单。">
  <link rel="stylesheet" href="styles.css?v=full-93-1">
  <link rel="stylesheet" href="positions.css?v=preferences-photo-4">
  <script src="data.js?v=update-1793635460695" defer></script>
  <script src="positions.js?v=positions-1" defer></script>
  <script src="app.js?v=preferences-photo-4" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到参考图</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="家的参考册首页"><span class="brand-mark" aria-hidden="true">⌂</span><span>家的参考册<small>HOME REFERENCE</small></span></a>
    <div class="top-actions">
      <span id="draft-status" class="save-status" aria-live="polite">已上传版本</span>
      <button class="button quiet" data-action="help">使用说明</button>
      <button class="button quiet" data-action="share">复制查看链接</button>
      <button class="button primary" data-action="export" id="export-button">导出更新</button>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <p class="nav-label">我的参考库</p>
      <nav aria-label="图库导航">
        <button class="nav-item active" data-action="view" data-view="gallery"><span>全部参考</span><span id="count-images">93</span></button>
        <button class="nav-item" data-action="view" data-view="categories"><span>元素分类</span><span id="count-elements">742</span></button>
        <button class="nav-item" data-action="view" data-view="preferences"><span>我的偏好</span><span id="count-liked">0</span></button>
        <button class="nav-item" data-action="view" data-view="pending"><span>待分析图片</span><span id="count-pending">0</span></button>
      </nav>
      <div class="sidebar-note"><span class="small-dot"></span><strong>收藏图片 ≠ 喜欢全部元素</strong><p>每张图里的材质、配色和细节，都可以分别选择。</p></div>
      <div class="sidebar-bottom">
        <button class="button outline full" data-action="upload" id="upload-button">＋ 添加参考图</button>
        <button class="button quiet full" data-action="import" id="import-button">导入已有标记</button>
        <button class="button quiet full" data-action="toggle-mode" id="mode-button">切换为查看模式</button>
        <p>文件保存在 Git 仓库<br>修改先存为本机草稿</p>
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <section class="page-heading">
        <div><p class="eyebrow">参考图 / 设计元素 / 个人偏好</p><h1 id="page-title">从图片里，找到喜欢的细节。</h1><p id="page-description">先看整体，再分别选择材质、配色、造型和灯光。</p></div>
        <div class="heading-side"><span class="trial-label">93 张参考图 · 已逐图分析</span><button class="button quiet" data-action="print">打印沟通清单 ↗</button></div>
      </section>
      <div id="view-notice" class="notice" hidden></div>
      <section class="filters" aria-label="筛选参考图">
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索文件名、元素或备注" aria-label="搜索文件名、元素或备注"></label>
        <label><span class="sr-only">空间</span><select id="space-filter" aria-label="按空间筛选"><option value="all">全部空间</option></select></label>
        <label><span class="sr-only">元素分类</span><select id="category-filter" aria-label="按元素分类筛选"><option value="all">全部元素</option></select></label>
        <label><span class="sr-only">材质细类</span><select id="material-filter" aria-label="按材质细类筛选"><option value="all">全部材质细类</option></select></label>
        <label id="material-type-filter-label" hidden><span class="sr-only">通用材质类型</span><select id="material-type-filter" aria-label="按通用材质类型筛选"><option value="all">全部通用类型</option></select></label>
        <label><span class="sr-only">偏好</span><select id="preference-filter" aria-label="按偏好筛选"><option value="all">全部偏好</option><option value="liked">喜欢</option><option value="considering">待考虑</option><option value="disliked">不喜欢</option><option value="unmarked">未标记</option></select></label>
        <button class="button quiet" data-action="reset-filters">清除筛选</button>
      </section>
      <div class="results-line"><span id="result-count" role="status"></span><label class="check-label"><input type="checkbox" id="favorite-filter">只看收藏图片</label></div>
      <div id="content"></div>
      <footer class="page-footer"><span>识别元素不代表个人偏好；实际材质以样品和设计师确认为准。</span><span id="version-label"></span></footer>
    </main>
  </div>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="edit-dialog" class="small-dialog" aria-labelledby="edit-title"></dialog>
  <dialog id="utility-dialog" class="small-dialog" aria-labelledby="utility-title"></dialog>
  <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
  <input id="data-input" type="file" accept="application/json,.json,.js" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>请启用浏览器 JavaScript，以使用搜索、筛选和元素标记功能。</noscript>
</body>
</html>
